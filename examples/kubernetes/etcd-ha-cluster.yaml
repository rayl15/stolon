###############################################################################
# 3-Node Highly Available etcd Cluster for Stolon
# Image: sourcefuse-stolon.jfrog.io/etcd:v3.5.26 (0 CVEs, Go 1.24.11)
# Note: This is a distroless image - no shell available
# Supports: IPv4, IPv6, and Dual-Stack clusters
###############################################################################
---
apiVersion: v1
kind: Namespace
metadata:
  name: etcd
---
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: etcd
  labels:
    app: etcd
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  # Uncomment for IPv6/Dual-Stack clusters:
  # ipFamilyPolicy: PreferDualStack
  # ipFamilies:
  #   - IPv6
  #   - IPv4
  ports:
    - port: 2379
      name: client
    - port: 2380
      name: peer
  selector:
    app: etcd
---
apiVersion: v1
kind: Service
metadata:
  name: etcd-client
  namespace: etcd
  labels:
    app: etcd
spec:
  type: ClusterIP
  # Uncomment for IPv6/Dual-Stack clusters:
  # ipFamilyPolicy: PreferDualStack
  # ipFamilies:
  #   - IPv6
  #   - IPv4
  ports:
    - port: 2379
      name: client
      targetPort: 2379
  selector:
    app: etcd
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: etcd
  labels:
    app: etcd
spec:
  serviceName: etcd
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      containers:
        - name: etcd
          image: sourcefuse-stolon.jfrog.io/etcd:v3.5.26
          imagePullPolicy: Always
          ports:
            - containerPort: 2379
              name: client
            - containerPort: 2380
              name: peer
          env:
            - name: ETCD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ETCD_DATA_DIR
              value: /var/lib/etcd
            - name: ETCD_INITIAL_CLUSTER_STATE
              value: new
            - name: ETCD_INITIAL_CLUSTER_TOKEN
              value: etcd-cluster-1
            - name: ETCD_INITIAL_CLUSTER
              value: etcd-0=http://etcd-0.etcd.etcd.svc.cluster.local:2380,etcd-1=http://etcd-1.etcd.etcd.svc.cluster.local:2380,etcd-2=http://etcd-2.etcd.etcd.svc.cluster.local:2380
            # Use [::] to listen on all interfaces (IPv4 and IPv6)
            - name: ETCD_LISTEN_PEER_URLS
              value: http://[::]:2380
            - name: ETCD_LISTEN_CLIENT_URLS
              value: http://[::]:2379
            # For etcd-0
            - name: ETCD_ADVERTISE_CLIENT_URLS
              value: http://$(ETCD_NAME).etcd.etcd.svc.cluster.local:2379
            - name: ETCD_INITIAL_ADVERTISE_PEER_URLS
              value: http://$(ETCD_NAME).etcd.etcd.svc.cluster.local:2380
          volumeMounts:
            - name: data
              mountPath: /var/lib/etcd
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 2379
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 2379
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# PodDisruptionBudget for HA
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: etcd-pdb
  namespace: etcd
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: etcd
