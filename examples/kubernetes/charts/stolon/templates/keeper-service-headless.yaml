apiVersion: v1
kind: Service
metadata:
  name: {{ include "stolon.keeper.fullname" . }}
  namespace: {{ include "stolon.namespace" . }}
  labels:
    {{- include "stolon.labels" . | nindent 4 }}
    app.kubernetes.io/component: keeper
  {{- with .Values.keeper.serviceAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  {{- if ne .Values.network.ipFamily "IPv4" }}
  ipFamilyPolicy: {{ include "stolon.ipFamilyPolicy" . }}
  ipFamilies:
  {{- include "stolon.ipFamilies" . | nindent 4 }}
  {{- end }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- if .Values.metrics.pgExporter.enabled }}
    - name: pg-exporter
      port: {{ .Values.metrics.pgExporter.port }}
      targetPort: pg-exporter
      protocol: TCP
    {{- end }}
  selector:
    {{- include "stolon.keeper.selectorLabels" . | nindent 4 }}
