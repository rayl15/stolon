{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "etcd-ha.serviceAccountName" . }}
  namespace: {{ include "etcd-ha.namespace" . }}
  labels:
    {{- include "etcd-ha.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
