apiVersion: v1
kind: Service
metadata:
  name: {{ include "etcd-ha.fullname" . }}
  namespace: {{ include "etcd-ha.namespace" . }}
  labels:
    {{- include "etcd-ha.labels" . | nindent 4 }}
  {{- with .Values.service.headless.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  {{- if ne .Values.network.ipFamily "IPv4" }}
  ipFamilyPolicy: {{ include "etcd-ha.ipFamilyPolicy" . }}
  ipFamilies:
  {{- include "etcd-ha.ipFamilies" . | nindent 4 }}
  {{- end }}
  ports:
    - name: client
      port: {{ .Values.network.clientPort }}
      targetPort: client
      protocol: TCP
    - name: peer
      port: {{ .Values.network.peerPort }}
      targetPort: peer
      protocol: TCP
  selector:
    {{- include "etcd-ha.selectorLabels" . | nindent 4 }}
